# Use this only in dev environments. It's not intended for production usage.
services:
  #
  # Local keycloak. To work properly, you need to change your local hosts file and add an alias to your
  # `127.0.0.1 localhost` line to look like this: `127.0.0.1 localhost keycloak`.
  # On Mac/Linux it is located in `/etc/hosts` on Win `C:\Windows\System32\Drivers\etc\hosts`
  #
  keycloak:
    container_name: keycloak
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.1-2}
    depends_on:
      - postgres-keycloak
    ports:
      - '8080:8080'
    command: 'start-dev --http-relative-path /auth'
    environment:
      KC_HOSTNAME: keycloak # this hostname must be resolved to 127.0.0.1 locally. Add it to your hosts file.
      KC_HOSTNAME_STRICT: 'false'
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak-user
      KC_DB_PASSWORD: keycloak-secret
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    networks:
      - local-keycloak
      - internal

  init-keycloak:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5
    depends_on:
      - keycloak
    env_file:
      - './local-docker.env'
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth # uses internal docker network to access the keycloak via its back channel port
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: 'true'
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_VARSUBSTITUTION_ENABLED: 'true'
      IMPORT_FILES_LOCATIONS: '/config/*.yml'
    volumes:
      - './keycloak:/config'
    networks:
      - local-keycloak

  postgres-engine:
    image: postgres:18.6
    container_name: postgres-engine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: enginedb
    ports:
      - '25433:5432'
    networks:
      - internal

  postgres-keycloak:
    image: postgres:18.6
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak-user
      POSTGRES_PASSWORD: keycloak-secret
    networks:
      - local-keycloak

networks:
  local-keycloak:
  internal:
