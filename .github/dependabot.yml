    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      tasklist-stack-docker-compose:
        applies-to: version-updates
        patterns: ['*']
      tasklist-stack-docker-compose-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/recipes/zeebe-external-tasklist/stack/docker'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:zeebe-external-tasklist'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      tasklist-stack-image-docker:
        applies-to: version-updates
        patterns: ['*']
      tasklist-stack-image-docker-security:
        applies-to: security-updates
