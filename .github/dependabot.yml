version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      root-github-actions:
        applies-to: version-updates
        patterns: ['*']
      root-github-actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'maven'
    directory: '/recipes/camunda7-cockpit-sso'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:camunda7-cockpit-sso'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: 'org.springframework.boot:*'
        versions: ['>=4.0.0']
    groups:
      sso-maven:
        applies-to: version-updates
        patterns: ['*']
      sso-maven-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'docker-compose'
    directory: '/recipes/camunda7-cockpit-sso/sso-stack'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:camunda7-cockpit-sso'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      sso-docker-compose:
        applies-to: version-updates
        patterns: ['*']
      sso-docker-compose-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'maven'
    directory: '/recipes/zeebe-external-tasklist'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:zeebe-external-tasklist'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      tasklist-maven:
        applies-to: version-updates
        patterns: ['*']
      tasklist-maven-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/recipes/zeebe-external-tasklist/apps/react-forms'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:zeebe-external-tasklist'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      tasklist-react-forms-npm:
        applies-to: version-updates
        patterns: ['*']
      tasklist-react-forms-npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/recipes/zeebe-external-tasklist/apps/tasklist'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:zeebe-external-tasklist'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 7
    groups:
      tasklist-app-npm:
        applies-to: version-updates
        patterns: ['*']
      tasklist-app-npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/recipes/zeebe-external-tasklist/apps/tasklist'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'recipe:zeebe-external-tasklist'
